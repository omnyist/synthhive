name: Deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# The test job spins up fixed-name containers on fixed ports (see below), so
# two runs of this workflow at once would have one `docker rm -f` the other's
# database mid-test. Serialise per repo rather than per ref: a PR run and a
# main run collide exactly as hard as two main runs.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: self-hosted
    # Self-hosted runner is macOS — GH Actions `services:` are Linux-only, so
    # spin throwaway Postgres/Redis via `docker run` (OrbStack) instead.
    # Ports are synthhive-specific to avoid colliding with other repos' CI.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Start test services
        run: |
          # `docker rm -fv`, not `docker rm -f`. The postgres image declares an
          # anonymous VOLUME, so removing the container without -v leaves its data
          # directory behind -- roughly 65 MB abandoned on the runner per CI run. By
          # 2026-08-30 Saya held 288 of them, about 18 GB, and nothing pointed at the
          # cause because each individual run looked like it cleaned up after itself.
          docker rm -fv synthhive-ci-pg synthhive-ci-redis 2>/dev/null || true
          docker run -d --name synthhive-ci-pg \
            -e POSTGRES_DB=synthhive -e POSTGRES_USER=synthhive -e POSTGRES_PASSWORD=synthhive \
            -p 5443:5432 postgres:16
          docker run -d --name synthhive-ci-redis -p 6403:6379 redis:alpine
          timeout 60 sh -c 'until docker exec synthhive-ci-pg pg_isready -U synthhive; do sleep 1; done'

      - name: Run tests
        env:
          DATABASE_URL: postgresql://synthhive:synthhive@localhost:5443/synthhive
          REDIS_URL: redis://localhost:6403/0
          # The Actions runner binary is x86_64 (Rosetta), so uv would
          # otherwise download an x86_64 CPython — for which packages like
          # cryptography no longer ship macOS wheels. Pin the native
          # arm64 interpreter installed via Homebrew on Saya.
          UV_PYTHON: /opt/homebrew/bin/python3.14
        run: uv run --group dev pytest -q

      - name: Lint
        run: uv run ruff check .

      - name: Audit async FK access
        # Written after four production SynchronousOnlyOperation bugs
        # from a cached-relation traversal inside async code, and until
        # now only ever run by hand — a check nobody is forced to run is
        # a declaration, not a gate. Exits 1 on a new violation.
        run: uv run python scripts/audit_async_fk.py

      - name: Stop test services
        if: always()
        run: docker rm -fv synthhive-ci-pg synthhive-ci-redis 2>/dev/null || true

  # The frontend was only ever checked at deploy time, so a build that
  # doesn't compile could reach main and fail during the deploy itself.
  # (bun lives in ~/.bun/bin, which a non-login step won't find.)
  frontend:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Add bun to PATH
        run: echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: bun run lint

      - name: Typecheck
        working-directory: frontend
        run: bun run typecheck

      - name: Build
        working-directory: frontend
        run: bun run build

  deploy:
    needs: [test, frontend]
    runs-on: self-hosted
    # Never on a pull request. PRs get a verdict from the checks above.
    # workflow_dispatch MUST reach here: the steps below already treat it as
    # "full deploy", and it is the documented override when the guest-live
    # check blocks a push. Gating this job on `== 'push'` silently disabled
    # both — the run went green having deployed nothing.
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Restart only what the push touched — every deploy used to
      # recreate the bot container, dropping chat mid-stream (and any
      # in-flight delayed action) for frontend-only changes.
      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            deps:
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Dockerfile'
              - 'docker-compose.prod.yml'
            backend:
              - 'core/**'
              - 'bot/**'
              - 'synthhive/**'
              - 'manage.py'
            frontend:
              - 'frontend/**'
            caddy:
              - 'Caddyfile'

      - name: Create .env file
        run: |
          cat > .env << EOF
          DEBUG=False
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          ALLOWED_HOSTS=${{ vars.ALLOWED_HOSTS }}
          DATABASE_URL=postgresql://synthhive:synthhive@synthcore-postgres:5432/synthhive
          REDIS_URL=redis://synthcore-redis:6379/1
          TWITCH_CLIENT_ID=${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET=${{ secrets.TWITCH_CLIENT_SECRET }}
          FERNET_KEY=${{ secrets.FERNET_KEY }}
          SYNTHFUNC_API_URL=${{ vars.SYNTHFUNC_API_URL }}
          SYNTHFUNC_API_KEY=${{ secrets.SYNTHFUNC_API_KEY }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          EOF

      - name: Check for live guest channels
        id: guests
        if: >-
          (steps.changes.outputs.deps == 'true' || steps.changes.outputs.backend == 'true')
          && github.event_name != 'workflow_dispatch'
        env:
          OWNER: ${{ vars.OWNER_CHANNEL }}
        run: |
          set -uo pipefail
          keys=$(docker exec synthcore-redis redis-cli -n 0 --scan --pattern 'stream:*:live' 2>/dev/null || true)
          if [ -z "$keys" ]; then
            echo "::warning::Could not read live flags from Redis — proceeding without the guest check."
            exit 0
          fi
          live=""
          for key in $keys; do
            slug="${key#stream:}"
            slug="${slug%:live}"
            if [ "$slug" = "$OWNER" ]; then
              continue
            fi
            state=$(docker exec synthcore-redis redis-cli -n 0 get "$key" 2>/dev/null | tr -d '\r')
            if [ "$state" = "true" ]; then
              live="$live $slug"
            fi
          done
          if [ -n "$live" ]; then
            echo "::error::Live guest channel(s):$live — a backend restart drops their chat mid-stream. Wait until they are offline, or re-run this workflow via workflow_dispatch to override."
            exit 1
          fi
          echo "No live guest channels; safe to restart the backend."

      # Selective deploy: server restarts run migrations via its startup
      # command; the bot only bounces when Python actually changed.
      # Full deploy: rebuild all images and recreate all containers
      - name: Full deploy (dependencies or infra changed)
        if: steps.changes.outputs.deps == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
          docker compose -f docker-compose.prod.yml restart caddy

      # Restarting the bot drops chat and kills anything in flight. On
      # the owner's own channel that's an accepted cost of working on
      # the bot live; on a guest's channel it's someone else's stream
      # breaking for reasons they can't see. Guests are "every tenant
      # that isn't the owner", so a new one is protected by default.
      # Deliberate override: re-run via workflow_dispatch.

      - name: Verify the containers are actually running
        run: |
          # Thirty seconds. The longest boot chain here is the server's
          # `migrate` then daphne; a container that is going to die on a bad
          # setting has done it well inside that, and a restart loop has had
          # time to be visible as one.
          sleep 30

          ids=$(docker compose -f docker-compose.prod.yml ps -aq)
          if [ -z "$ids" ]; then
            # An empty list here is not "nothing is wrong", it is "this check
            # could not see what it is meant to verify" — the same shape as a
            # search that returns nothing because it failed to run.
            echo "No containers found for this compose project."
            exit 1
          fi

          failed=""
          for cid in $ids; do
            info=$(docker inspect --format '{{.Name}} {{.State.Status}} {{.State.ExitCode}}' "$cid")
            name=$(echo "$info" | cut -d' ' -f1 | sed 's|^/||')
            state=$(echo "$info" | cut -d' ' -f2)
            code=$(echo "$info" | cut -d' ' -f3)
            case "$state" in
              running|created)
                echo "ok: $name ($state)"
                ;;
              exited)
                # A one-shot that finished its job is not a failure. Read from
                # the exit code rather than from a list of service names:
                # frontend-build is the only one today, and an enumerated list
                # is a promise to remember the next one.
                if [ "$code" = "0" ]; then
                  echo "ok: $name (exited 0, one-shot)"
                else
                  echo "FAILED: $name exited $code"
                  failed="$failed $name"
                fi
                ;;
              *)
                # restarting, dead, paused — all of them mean this container is
                # not doing its job right now.
                echo "FAILED: $name is $state"
                failed="$failed $name"
                ;;
            esac
          done

          if [ -n "$failed" ]; then
            for name in $failed; do
              echo "----- $name: last 30 log lines -----"
              docker logs --tail 30 "$name" 2>&1 || true
            done
            echo "Deploy verification failed:$failed"
            exit 1
          fi

      - name: Rebuild images (backend changes)
        if: >-
          steps.changes.outputs.deps != 'true' && github.event_name != 'workflow_dispatch'
          && steps.changes.outputs.backend == 'true'
        run: docker compose -f docker-compose.prod.yml build

      - name: Restart server and bot
        if: >-
          steps.changes.outputs.deps != 'true' && github.event_name != 'workflow_dispatch'
          && steps.changes.outputs.backend == 'true'
        run: docker compose -f docker-compose.prod.yml up -d server bot

      # frontend-build is a one-shot (restart: "no"); `up` re-runs it
      # because it sits in the exited state after each build.
      - name: Rebuild frontend
        if: >-
          steps.changes.outputs.deps != 'true' && github.event_name != 'workflow_dispatch'
          && steps.changes.outputs.frontend == 'true'
        run: docker compose -f docker-compose.prod.yml up -d frontend-build

      # Caddyfile is bind-mounted; only a restart picks up changes.
      - name: Restart caddy
        if: >-
          steps.changes.outputs.deps != 'true' && github.event_name != 'workflow_dispatch'
          && steps.changes.outputs.caddy == 'true'
        run: docker compose -f docker-compose.prod.yml restart caddy

      - name: Prune images
        run: docker image prune -f
