platform: linux

image_resource:
  type: registry-image
  source:
    repository: alpine
    tag: "3.20"

params:
  SSH_KEY: ((saya_ssh_key))
  KNOWN_HOSTS: ((saya_known_hosts))

run:
  path: sh
  args:
    - -ec
    - |
      apk add --no-cache openssh-client >/dev/null
      mkdir -p ~/.ssh
      echo "$SSH_KEY" > ~/.ssh/id_ed25519
      chmod 600 ~/.ssh/id_ed25519
      echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      ssh -i ~/.ssh/id_ed25519 -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=10 Avalonstar@10.0.20.10 \
        'docker rm -fv synthhive-ci-pg synthhive-ci-redis 2>/dev/null || true'
