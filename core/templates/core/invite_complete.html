{% extends "core/invite_base.html" %}

{% block content %}

    <div class="step done"></div>
    <div class="step done"></div>
</div>

<div class="success-icon">&#10003;</div>

<h1 style="text-align: center;">You're all set</h1>

    Go to Dashboard
</a>
{% endblock %}
