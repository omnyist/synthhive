services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - gh_token
    container_name: synthhive-server
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - default
      - synth
    command: >
      sh -c "uv run python manage.py migrate &&
             uv run python manage.py seed &&
             uv run python manage.py collectstatic --noinput &&
             uv run daphne -b 0.0.0.0 -p 7177 --application-close-timeout 60 synthhive.asgi:application"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - gh_token
    container_name: synthhive-bot
    restart: unless-stopped
    depends_on:
      - server
    env_file:
      - .env
    networks:
      - default
      - synth
    command: uv run python manage.py runbot

  frontend-build:
    image: oven/bun:latest
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_dist:/app/dist
    command: sh -c "bun install --frozen-lockfile && bun run build"
    restart: "no"

  caddy:
    image: caddy:2
    container_name: synthhive-caddy
    restart: unless-stopped
    depends_on:
      - server
      - frontend-build
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - synth

networks:
  default:
  synth:
    external: true

volumes:
  frontend_dist:
  caddy_data:
  caddy_config:

secrets:
  # Sourced from the shell environment on the invocation that runs
  # `docker compose build`/`up --build` (the Actions deploy job), never
  # from .env -- env_file above already wires every service's runtime
  # environment, and a token placed there would be readable via
  # `docker inspect` indefinitely, not just present during the build.
  gh_token:
    environment: GH_TOKEN
